name: Build APK

on:
  push:
    # "pruebas": builds without publishing anything to Releases (for testing first)
    branches: [ main, pruebas ]
    # README-only changes do not create a new app version
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Check that the version is new
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json name --jq '.[].name' | grep -Fxq "Dolby Atmos $APP_VERSION"; then
            echo "::error::Version $APP_VERSION is already published. Bump the number in the VERSION file."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signing key (from Secrets)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          umask 077
          echo "$KS" | base64 -d > "$RUNNER_TEMP/audiomax.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/audiomax.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk DolbyAtmos.apk

      - name: Show build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A 2 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Measurement build (pruebas branch only, never published)
        if: github.ref == 'refs/heads/pruebas'
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          gradle assembleMeasure --no-daemon
          cp app/build/outputs/apk/measure/app-measure.apk DolbyAtmos-measure.apk

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/pruebas'
        with:
          name: DolbyAtmos-measure
          path: DolbyAtmos-measure.apk

      - name: Delete the key
        if: always()
        run: rm -f "$RUNNER_TEMP/audiomax.jks"

      - name: Update data (update.json)
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          build = int(os.environ["GITHUB_RUN_NUMBER"])
          repo = os.environ["GITHUB_REPOSITORY"]
          # MIN_BUILD: builds below this number must update (0 = never forced)
          min_build = int(open("MIN_BUILD").read().strip() or 0) if os.path.exists("MIN_BUILD") else 0
          data = {
              "build": build,
              "notes": open("RELEASE_NOTES.md", encoding="utf-8").read(),
              "apk": f"https://github.com/{repo}/releases/download/build-{build}/DolbyAtmos.apk",
              "size": os.path.getsize("DolbyAtmos.apk"),
              "sha256": hashlib.sha256(open("DolbyAtmos.apk", "rb").read()).hexdigest(),
              "min_build": min_build,
              "version": os.environ["APP_VERSION"],
          }
          json.dump(data, open("update.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: DolbyAtmos
          path: DolbyAtmos.apk

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dolby Atmos ${{ env.APP_VERSION }}
          files: |
            DolbyAtmos.apk
            update.json
          body_path: RELEASE_NOTES.md
